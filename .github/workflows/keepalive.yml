name: Streamlitアプリを起こしておく

on:
  schedule:
    - cron: "17 */6 * * *"   # 6時間おき（UTC）。12時間の休止ラインより内側
  workflow_dispatch:          # Actions画面から手動実行も可能

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwrightを準備
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: アプリを開き、休止中なら起動ボタンを押す
        env:
          APP_URL: https://biz-creation-hxs39vtbpdnu2ux8brjr2p.streamlit.app
        run: python .github/scripts/keepalive.py
